<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 155" width="650" height="155">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <style>
      .header {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 15.5px;
        font-weight: 700;
        fill: #38bdf8;
      }
      .lang-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .pct-text {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 12px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <rect width="650" height="155" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <text x="26" y="32" class="header">💻 Most Used Languages Across All 18 Repositories (Public &amp; Private)</text>

  <!-- Multi-Segment Progress Bar -->
  <g transform="translate(26, 48)">
    <!-- Dart / Flutter (28%) -->
    <rect x="0" y="0" width="168" height="12" rx="4" fill="#00B4AB" />
    <!-- Python (24%) -->
    <rect x="170" y="0" width="144" height="12" fill="#3572A5" />
    <!-- JavaScript / TypeScript (20%) -->
    <rect x="316" y="0" width="120" height="12" fill="#3178C6" />
    <!-- HTML5 / CSS3 (14%) -->
    <rect x="438" y="0" width="84" height="12" fill="#e34c26" />
    <!-- SQL / PostGIS (8%) -->
    <rect x="524" y="0" width="46" height="12" fill="#3ECF8E" />
    <!-- PHP & C (6%) -->
    <rect x="572" y="0" width="26" height="12" rx="4" fill="#a855f7" />
  </g>

  <!-- Legend Row 1 -->
  <g transform="translate(26, 88)">
    <circle cx="6" cy="-4" r="5" fill="#00B4AB" />
    <text x="18" y="0" class="lang-text">Dart / Flutter <tspan class="pct-text">28%</tspan></text>

    <circle cx="216" cy="-4" r="5" fill="#3572A5" />
    <text x="228" y="0" class="lang-text">Python <tspan class="pct-text">24%</tspan></text>

    <circle cx="416" cy="-4" r="5" fill="#3178C6" />
    <text x="428" y="0" class="lang-text">TypeScript &amp; JS <tspan class="pct-text">20%</tspan></text>
  </g>

  <!-- Legend Row 2 -->
  <g transform="translate(26, 120)">
    <circle cx="6" cy="-4" r="5" fill="#e34c26" />
    <text x="18" y="0" class="lang-text">HTML5 &amp; CSS3 <tspan class="pct-text">14%</tspan></text>

    <circle cx="216" cy="-4" r="5" fill="#3ECF8E" />
    <text x="228" y="0" class="lang-text">SQL &amp; PostGIS <tspan class="pct-text">8%</tspan></text>

    <circle cx="416" cy="-4" r="5" fill="#a855f7" />
    <text x="428" y="0" class="lang-text">PHP &amp; C <tspan class="pct-text">6%</tspan></text>
  </g>
</svg>
