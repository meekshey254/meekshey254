<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .highlight {
        fill: url(#accentGrad);
      }
      .subtitle {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.4px;
      }
      .badge-text {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 12.5px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .terminal-text {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 12px;
        fill: #38bdf8;
      }
      .pulse-dot {
        animation: pulse 2.2s infinite ease-in-out;
      }
      .float-slow {
        animation: floatSlow 6s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Main Card Background -->
  <rect width="1000" height="280" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1000" height="280" rx="18" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="1000" height="280" rx="18" fill="url(#glowLeft)" />
  <rect width="1000" height="280" rx="18" fill="url(#glowRight)" />

  <!-- Layered Bottom Waves -->
  <path d="M0,225 C250,275 450,175 720,230 C860,258 940,215 1000,225 L1000,280 L0,280 Z" fill="url(#waveGrad1)" />
  <path d="M0,242 C200,195 520,275 780,220 C890,198 960,240 1000,235 L1000,280 L0,280 Z" fill="url(#waveGrad2)" />

  <!-- Top Status Bar Pill -->
  <g transform="translate(55, 36)">
    <rect width="265" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" class="pulse-dot" />
    <text x="30" y="18.5" class="terminal-text">~/meekshey254 • Online &amp; Building</text>
  </g>

  <!-- Main Heading -->
  <text x="55" y="116" class="title">
    Hi, I'm <tspan class="highlight">Meshack Muema</tspan> <tspan font-size="38">👋</tspan>
  </text>

  <!-- Subtitle -->
  <text x="55" y="152" class="subtitle">
    Full-Stack &amp; Flutter Engineer  •  Python &amp; NLP Enthusiast  •  Cloud &amp; Geospatial Builder
  </text>

  <!-- Tech Stack Pills Row -->
  <g transform="translate(55, 178)">
    <rect x="0" y="0" width="128" height="32" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <text x="64" y="20.5" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ Flutter &amp; Dart</text>

    <rect x="140" y="0" width="150" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <text x="215" y="20.5" text-anchor="middle" class="badge-text" fill="#34d399">🗄️ Supabase &amp; PostGIS</text>

    <rect x="302" y="0" width="142" height="32" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
    <text x="373" y="20.5" text-anchor="middle" class="badge-text" fill="#818cf8">🐍 Python &amp; Django</text>

    <rect x="456" y="0" width="148" height="32" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <text x="530" y="20.5" text-anchor="middle" class="badge-text" fill="#c084fc">⚛️ React &amp; TypeScript</text>
  </g>

  <!-- Right Side Decorative Code Terminal Card -->
  <g transform="translate(685, 42)" class="float-slow">
    <rect width="265" height="175" rx="12" fill="#0b1120" fill-opacity="0.92" stroke="#334155" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <text x="135" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">meek@dev: ~</text>
    <line x1="0" y1="32" x2="265" y2="32" stroke="#1e293b" stroke-width="1" />

    <!-- Code Lines -->
    <text x="18" y="56" font-family="Consolas, monospace" font-size="12" fill="#c084fc">const <tspan fill="#38bdf8">developer</tspan> = {</text>
    <text x="32" y="76" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">name: <tspan fill="#4ade80">'Meshack (Meek)'</tspan>,</text>
    <text x="32" y="96" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">repos: <tspan fill="#facc15">18</tspan>,</text>
    <text x="32" y="116" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">focus: <tspan fill="#4ade80">'Offline-First &amp; AI'</tspan>,</text>
    <text x="32" y="136" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">status: <tspan fill="#38bdf8">'Shipping Code 🚀'</tspan></text>
    <text x="18" y="156" font-family="Consolas, monospace" font-size="12" fill="#c084fc">};</text>
  </g>
</svg>
