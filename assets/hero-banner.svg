<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .highlight {
        fill: url(#accentGrad);
      }
      .subtitle {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 11.5px;
        font-weight: 600;
      }
      .terminal-text {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 11.5px;
        fill: #38bdf8;
      }
      .pulse-dot {
        animation: pulse 2.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Main Card Background -->
  <rect width="1000" height="260" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1000" height="260" rx="18" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="1000" height="260" rx="18" fill="url(#glowLeft)" />
  <rect width="1000" height="260" rx="18" fill="url(#glowRight)" />

  <!-- Layered Bottom Waves -->
  <path d="M0,210 C250,255 450,165 720,215 C860,240 940,200 1000,210 L1000,260 L0,260 Z" fill="url(#waveGrad1)" />
  <path d="M0,226 C200,185 520,255 780,205 C890,185 960,225 1000,220 L1000,260 L0,260 Z" fill="url(#waveGrad2)" />

  <!-- Top Status Bar Pill -->
  <g transform="translate(46, 32)">
    <rect width="260" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" class="pulse-dot" />
    <text x="30" y="18" class="terminal-text">~/meekshey254 • Online &amp; Building</text>
  </g>

  <!-- Main Heading -->
  <text x="46" y="106" class="title">
    Hi, I'm <tspan class="highlight">Meshack Muema</tspan> <tspan font-size="34">👋</tspan>
  </text>

  <!-- Subtitle -->
  <text x="46" y="140" class="subtitle">
    Full-Stack &amp; Flutter Engineer  •  Python &amp; NLP  •  Cloud &amp; Geospatial Builder
  </text>

  <!-- Tech Stack Pills Row -->
  <g transform="translate(46, 168)">
    <rect x="0" y="0" width="128" height="32" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <text x="64" y="20" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ Flutter &amp; Dart</text>

    <rect x="138" y="0" width="152" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <text x="214" y="20" text-anchor="middle" class="badge-text" fill="#34d399">🗄️ Supabase &amp; PostGIS</text>

    <rect x="300" y="0" width="140" height="32" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
    <text x="370" y="20" text-anchor="middle" class="badge-text" fill="#818cf8">🐍 Python &amp; Django</text>

    <rect x="450" y="0" width="148" height="32" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <text x="524" y="20" text-anchor="middle" class="badge-text" fill="#c084fc">⚛️ React &amp; TypeScript</text>
  </g>

  <!-- Right Side Code Terminal Card (Fixed Coordinates - No CSS Transform Override) -->
  <g transform="translate(692, 36)">
    <rect width="264" height="176" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <text x="135" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">meek@dev: ~</text>
    <line x1="0" y1="32" x2="264" y2="32" stroke="#1e293b" stroke-width="1" />

    <!-- Code Lines -->
    <text x="18" y="56" font-family="Consolas, monospace" font-size="12" fill="#c084fc">const <tspan fill="#38bdf8">developer</tspan> = {</text>
    <text x="30" y="78" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">name: <tspan fill="#4ade80">'Meshack (Meek)'</tspan>,</text>
    <text x="30" y="100" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">repos: <tspan fill="#facc15">18</tspan>,</text>
    <text x="30" y="122" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">focus: <tspan fill="#4ade80">'Offline-First &amp; AI'</tspan>,</text>
    <text x="30" y="144" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">status: <tspan fill="#38bdf8">'Shipping Code 🚀'</tspan></text>
    <text x="18" y="164" font-family="Consolas, monospace" font-size="12" fill="#c084fc">};</text>
  </g>
</svg>
