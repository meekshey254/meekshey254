<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="540" height="210">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="rankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <style>
      .header {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #38bdf8;
      }
      .row-label {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .row-val {
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 12.5px;
        font-weight: 700;
      }
      .c-blue { fill: #38bdf8; }
      .c-green { fill: #34d399; }
      .c-indigo { fill: #818cf8; }
      .c-purple { fill: #c084fc; }
      .c-amber { fill: #facc15; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="210" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="34" class="header">⚡ Meshack Muema's GitHub Stats</text>
  <line x1="24" y1="46" x2="516" y2="46" stroke="#1e293b" stroke-width="1" />

  <!-- Stat Rows (Left Label Column x=24, Value Column x=268, Max X=410) -->
  <g transform="translate(0, 0)">
    <text x="24" y="74" class="row-label">📦 Total Repositories (Public &amp; Private):</text>
    <text x="272" y="74" class="row-val c-blue">18 Repos</text>

    <text x="24" y="102" class="row-label">🚀 Flagship Systems Engineered:</text>
    <text x="272" y="102" class="row-val c-green">6+ Full-Stack</text>

    <text x="24" y="130" class="row-label">📱 Mobile &amp; Cloud Stack:</text>
    <text x="272" y="130" class="row-val c-indigo">Flutter &amp; Supabase</text>

    <text x="24" y="158" class="row-label">🗄️ Geospatial &amp; Offline Sync:</text>
    <text x="272" y="158" class="row-val c-purple">PostGIS &amp; SQLite</text>

    <text x="24" y="186" class="row-label">🤝 Community &amp; Dev Status:</text>
    <text x="272" y="186" class="row-val c-amber">Active Builder</text>
  </g>

  <!-- Vertical Divider Before Rank Badge -->
  <line x1="428" y1="58" x2="428" y2="192" stroke="#1e293b" stroke-width="1.5" />

  <!-- Right Side Rank Circle (Centered at x=484, y=125 - Zero Overlap) -->
  <g transform="translate(484, 125)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#1e293b" stroke-width="5.5" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#rankGrad)" stroke-width="5.5" stroke-dasharray="198 226" stroke-linecap="round" transform="rotate(-90)" />
    <text x="0" y="5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">A+</text>
    <text x="0" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="700" fill="#94a3b8">BUILDER</text>
  </g>
</svg>
