<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <style>
      .stat-num {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 26px;
        font-weight: 800;
        fill: #f8fafc;
      }
      .stat-label {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .stat-sub {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #94a3b8;
      }
      .flame {
        animation: pulseGlow 2s infinite ease-in-out;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="495" height="195" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Dividers -->
  <line x1="165" y1="28" x2="165" y2="167" stroke="#1e293b" stroke-width="1.5" />
  <line x1="330" y1="28" x2="330" y2="167" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left Column: Total Repositories & Active Commits -->
  <g transform="translate(82.5, 0)">
    <text x="0" y="78" text-anchor="middle" class="stat-num">18</text>
    <text x="0" y="108" text-anchor="middle" class="stat-label">Total Repositories</text>
    <text x="0" y="130" text-anchor="middle" class="stat-sub">Public &amp; Private Projects</text>
    <text x="0" y="150" text-anchor="middle" class="stat-sub" fill="#34d399">● Active Development</text>
  </g>

  <!-- Center Column: Streak Ring -->
  <g transform="translate(247.5, 0)">
    <!-- Background Ring -->
    <circle cx="0" cy="82" r="40" fill="none" stroke="#1e293b" stroke-width="5" />
    <!-- Active Gradient Ring -->
    <circle cx="0" cy="82" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-dasharray="220 252" stroke-linecap="round" transform="rotate(-90 0 82)" />
    <!-- Top Flame Badge -->
    <circle cx="0" cy="42" r="13" fill="#0b0f19" />
    <text x="0" y="48" text-anchor="middle" font-size="15" class="flame">🔥</text>

    <!-- Center Metric -->
    <text x="0" y="90" text-anchor="middle" class="stat-num" fill="#38bdf8">Active</text>
    <text x="0" y="144" text-anchor="middle" class="stat-label" fill="#f43f5e">Meshack's GitHub Streak</text>
    <text x="0" y="164" text-anchor="middle" class="stat-sub">Shipping Mobile &amp; Web Code</text>
  </g>

  <!-- Right Column: Multi-Stack Breadth -->
  <g transform="translate(412.5, 0)">
    <text x="0" y="78" text-anchor="middle" class="stat-num">8+</text>
    <text x="0" y="108" text-anchor="middle" class="stat-label">Core Languages</text>
    <text x="0" y="130" text-anchor="middle" class="stat-sub">Dart • Python • TS/JS</text>
    <text x="0" y="150" text-anchor="middle" class="stat-sub">SQL • PHP • HTML/CSS • C</text>
  </g>
</svg>
